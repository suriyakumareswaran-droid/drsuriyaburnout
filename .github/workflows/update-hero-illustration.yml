name: Update hero illustration

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-hero:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch hero illustration
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          marker = 'Colourful illustration of a tired staff member'
          if marker in html:
              print('Hero illustration already updated.')
              raise SystemExit(0)

          new_hero = '''<div class="hero-art"><svg viewBox="0 0 360 260" role="img" aria-label="Colourful illustration of a tired staff member receiving workplace support"><defs><linearGradient id="deskGrad" x1="0" x2="1"><stop offset="0" stop-color="#00a7c8"/><stop offset=".48" stop-color="#2457a6"/><stop offset="1" stop-color="#cf4f83"/></linearGradient><linearGradient id="cardGrad" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#e8f8f3"/></linearGradient></defs><circle cx="72" cy="72" r="42" fill="#e8f8f3"/><circle cx="285" cy="55" r="36" fill="#fff0f6"/><circle cx="296" cy="182" r="32" fill="#fff6df"/><path d="M42 218h278" stroke="url(#deskGrad)" stroke-width="10" stroke-linecap="round"/><rect x="44" y="150" width="270" height="60" rx="16" fill="#fff" stroke="#c8ddff" stroke-width="3"/><rect x="62" y="164" width="102" height="12" rx="6" fill="#bde7dc"/><rect x="62" y="187" width="78" height="9" rx="5" fill="#ffd0e3"/><rect x="207" y="160" width="76" height="36" rx="9" fill="#edf5ff" stroke="#2457a6" stroke-width="3"/><path d="M222 178h46" stroke="#0b947b" stroke-width="6" stroke-linecap="round"/><path d="M139 132c-14 0-23 9-23 23v18h86v-18c0-14-9-23-23-23h-40z" fill="#2457a6"/><path d="M121 173h86v36h-86z" fill="#2457a6"/><path d="M145 121c-10-9-12-25-3-36 9-12 28-12 38 0 8 10 7 28-3 36v16h-32v-16z" fill="#ffd6b5" stroke="#6a3a2b" stroke-width="3"/><path d="M140 85c6-18 35-18 43-1 4 7 3 14 1 19-12-5-28-5-43 0-3-5-4-11-1-18z" fill="#17283d"/><path d="M151 111c10 7 21 7 31 0" stroke="#6a3a2b" stroke-width="3" stroke-linecap="round"/><path d="M132 167c24 14 52 14 76 0" stroke="#0b947b" stroke-width="11" stroke-linecap="round"/><path d="M98 136c9 7 19 12 31 15" stroke="#ffd6b5" stroke-width="14" stroke-linecap="round"/><path d="M220 151c10-4 18-10 25-19" stroke="#ffd6b5" stroke-width="14" stroke-linecap="round"/><rect x="52" y="62" width="76" height="58" rx="12" fill="#fff" stroke="#0b947b" stroke-width="3"/><path d="M70 82h39M70 99h28" stroke="#0b947b" stroke-width="6" stroke-linecap="round"/><path d="M239 68h69a13 13 0 0113 13v45a13 13 0 01-13 13h-19l-22 18 5-18h-33a13 13 0 01-13-13V81a13 13 0 0113-13z" fill="#fff" stroke="#cf4f83" stroke-width="3"/><path d="M249 91h48M249 108h36" stroke="#cf4f83" stroke-width="6" stroke-linecap="round"/><circle cx="74" cy="33" r="17" fill="#fff" stroke="#f3b43f" stroke-width="4"/><path d="M74 23v11l8 6" stroke="#f3b43f" stroke-width="4" stroke-linecap="round"/><rect x="232" y="24" width="58" height="30" rx="8" fill="#0b947b"/><path d="M244 39h34" stroke="#fff" stroke-width="5" stroke-linecap="round"/><path d="M101 33h31M108 44h42" stroke="#6755d8" stroke-width="5" stroke-linecap="round"/><path d="M275 198c10-16 28-19 44-11-6 18-24 26-44 23z" fill="#bde7dc" stroke="#0b947b" stroke-width="3"/><path d="M286 203c8-2 17-6 25-14" stroke="#0b947b" stroke-width="4" stroke-linecap="round"/></svg></div>'''

          html, n = re.subn(r'<div class="hero-art"><svg\b.*?</svg></div>', new_hero, html, count=1, flags=re.S)
          if n != 1:
              raise RuntimeError(f'Expected one hero illustration to replace, replaced {n}.')
          path.write_text(html, encoding='utf-8')
          PY
      - name: Commit patched HTML
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html change needed."
            exit 0
          fi
          git config user.name "suriyakumareswaran-droid"
          git config user.email "suriyakumareswaran@gmail.com"
          git add index.html
          git commit -m "Update burnout staff illustration"
          git push
