ons].forEach((o,i)=>o.textContent=c.impactOpts[i]);[...$('selfHarm').options].forEach((o,i)=>o.textContent=c.safetyOpts[i]);text('#output>.title h2',c.outputTitle);text('#output>.title .muted',c.outputText);text('#tab-results',c.tabResults);text('#tab-action',c.tabAction);text('#results h2',c.auto);text('#results .muted',c.autoText);text('#calculateBtn',c.calc);text('#completionNotice',c.complete);let next=document.querySelector('.next p');if(next)next.innerHTML=`<strong>${c.next}</strong> ${c.nextText}`;text('#viewPlanBtn',c.viewPlan);text('#plan h2',c.guided);text('#plan .muted',c.guidedText);text('#plan .pill',c.printReady);text('.own h3',c.otherTitle);text('.own p',c.otherText);text('.own .field-label',c.otherLabel);if($('ownActionPlan'))$('ownActionPlan').placeholder=c.otherPlaceholder;text('#action>.notice',c.finalNote);text('#printBtn',c.printBtn);text('#resetBtn',c.reset);text('#references h2',c.refs);text('#references .muted',c.refsText);text('.footer',c.footer)}
