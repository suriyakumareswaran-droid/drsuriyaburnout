name: Apply bilingual HD update
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch site files
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'class="lang-toggle"' not in s:
              s = s.replace('</p></div>\n<nav>', '</p><div class="lang-toggle" aria-label="Language"><button type="button" class="active" data-lang="en">English</button><button type="button" data-lang="bm">Bahasa Malaysia</button></div></div>\n<nav>')
          css = r'''
/* premium-hd-layer */
.lang-toggle{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:14px}.lang-toggle button{min-height:34px;border:1px solid rgba(255,255,255,.28);border-radius:999px;background:rgba(255,255,255,.11);color:#fff;font:inherit;font-size:.78rem;font-weight:900;cursor:pointer}.lang-toggle button.active{background:#fff;color:var(--navy);box-shadow:0 10px 22px rgba(0,0,0,.14)}
.hero{isolation:isolate;background:radial-gradient(circle at 82% 20%,rgba(255,208,227,.95),transparent 24%),radial-gradient(circle at 18% 78%,rgba(189,231,220,.9),transparent 28%),linear-gradient(135deg,#f8fbff 0%,#eef6ff 42%,#fff4fa 100%)}.hero:after{content:"";position:absolute;inset:22px clamp(14px,4vw,44px);z-index:0;border:1px solid rgba(255,255,255,.82);border-radius:18px;background:linear-gradient(135deg,rgba(255,255,255,.55),rgba(255,255,255,.16));box-shadow:0 26px 80px rgba(30,51,78,.18);pointer-events:none}.hero-inner{z-index:1}.hero h2{font-weight:950;letter-spacing:.1px;text-wrap:balance;text-shadow:0 1px 0 rgba(255,255,255,.7)}.hero p{font-size:1.02rem}.hero-art{position:relative;min-height:286px;display:grid;place-items:center}.hero-art:before{content:"";position:absolute;width:310px;height:230px;border-radius:28px;background:linear-gradient(135deg,rgba(36,87,166,.14),rgba(11,148,123,.14),rgba(207,79,131,.12));filter:blur(1px);box-shadow:0 28px 70px rgba(9,43,87,.22)}.hero-art svg{position:relative;width:min(100%,360px);padding:10px;border-radius:24px;background:linear-gradient(145deg,rgba(255,255,255,.9),rgba(255,255,255,.34));box-shadow:0 24px 50px rgba(9,43,87,.18),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(10px)}.mini,.card,.domain,.score-card,.action,.own,.notice,.tabs{box-shadow:0 18px 42px rgba(25,44,70,.08)}.card,.domain,.score-card,.action,.own,.notice,.tabs{border-color:rgba(36,87,166,.16)}.btn{box-shadow:0 10px 22px rgba(9,43,87,.16);transition:transform .16s ease,box-shadow .16s ease}.btn:hover{transform:translateY(-1px);box-shadow:0 16px 28px rgba(9,43,87,.2)}.section{position:relative}.section:before{content:"";position:absolute;left:clamp(16px,4vw,34px);right:clamp(16px,4vw,34px);top:0;height:1px;background:linear-gradient(90deg,transparent,rgba(0,167,200,.28),rgba(207,79,131,.22),transparent)}.q:hover{background:linear-gradient(90deg,rgba(237,245,255,.75),rgba(255,255,255,.5))}.answers label{transition:transform .14s ease,border-color .14s ease,box-shadow .14s ease}.answers label:hover{transform:translateY(-1px);border-color:rgba(11,148,123,.5);box-shadow:0 10px 20px rgba(9,43,87,.1)}.lang-toggle button{transition:transform .14s ease,background .14s ease}.lang-toggle button:hover{transform:translateY(-1px)}@media(max-width:1000px){.hero:after{inset:10px;border-radius:14px}.hero-art{min-height:230px;justify-content:center}.hero-art:before{width:240px;height:180px}.hero-art svg{width:min(100%,290px)}}@media(max-width:640px){.hero-art{min-height:218px}.hero svg{width:min(100%,276px)}.hero h2{font-size:1.5rem}.hero p{font-size:.95rem}.card,.domain,.score-card,.action,.own,.notice{box-shadow:0 12px 26px rgba(25,44,70,.07)}}@media print{.hero:after,.section:before{display:none}}
'''
          if 'premium-hd-layer' not in s:
              s = s.replace('\n</style>', '\n' + css + '\n</style>')
          if '<script src="i18n.js"></script>' not in s:
              s = s.replace('\n</body>', '\n<script src="i18n.js"></script>\n</body>')
          p.write_text(s, encoding='utf-8')
          js = r'''
