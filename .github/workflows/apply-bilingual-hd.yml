s very low, 5 is very high.',scale:['To a Very Low Degree','To a Low Degree','Somewhat High','To a High Degree','To a Very High Degree'],stressTitle:'Workplace Stressors and Safety',stressText:'Select any current issues. These help shape the action plan.',impact:'Current functional impact',safety:'Immediate safety concern or self-harm thought?',impactOpts:['No major impact','Mild impact','Moderate impact','Severe impact / cannot function safely'],safetyOpts:['No','Yes - urgent support needed'],outputTitle:'Results and Action Plan',outputText:'Step 1 shows your result. Step 2 opens your guided action plan and print options.',tabResults:'1. Results',tabAction:'2. Action Plan + Print',auto:'Automated Result',autoText:'Scores are for planning, not diagnosis.',calc:'Calculate Now',complete:'Answer all 19 questions to generate your result and action plan.',overall:'Overall priority',mainConcern:'Main concern',urgentMsg:'Urgent support is recommended because a safety or severe functional concern was selected.',resultMsg:'Your result suggests burnout-related symptoms. This is not a diagnosis.',next:'Next:',nextText:'open your guided action plan, then print or save your personal copy.',viewPlan:'View My Action Plan',guided:'Guided Workplace Action Plan',guidedText:'Each card gives a quick visual summary. Open details only when needed.',printReady:'Print ready',planEmpty:'Complete the questionnaire to generate a tailored action plan.',detailsMore:'Details / More information',otherTitle:'Other Issue / Isu Lain',otherText:'Type any other workplace issue not captured above. The tool will add an issue-based action plan from your statement.',otherLabel:'Other issue statement / Pernyataan isu lain',otherPlaceholder:'Example: I am facing workload, bullying, poor communication, lack of staff, shift fatigue, conflict, resource problems, or emotionally difficult cases.',finalNote:'Complete all 19 questions, review your result and action plan, then print or save your personal copy.',printBtn:'Print / Save PDF',reset:'Reset',refs:'References',refsText:'References used to structure the explanation, scoring, and action plan.',footer:'This tool is an individual support aid. It should complement, not replace, employer psychosocial risk assessment processes, occupational health advice, or professional healthcare assessment.',bands:{Low:'Low',Mild:'Mild',Moderate:'Moderate',High:'High',Urgent:'Urgent'},domain:{personal:'Personal Burnout',work:'Work-Related Burnout',client:'Client / Patient-Related Burnout'},action:{'Urgent Safety Step':['Urgent Safety Step','Safety first','If safety is affected, get help before planning work changes.'],'Individual Recovery Actions':['Individual Recovery Actions','Recharge','Start with recovery basics before adding more tasks.'],'Supervisor and Work Design Actions':['Supervisor and Work Design Actions','Work design','Make work lighter, clearer, and more predictable.'],'Client / Patient-Facing Support':['Client / Patient-Facing Support','Client-facing support','Support before and after emotionally demanding interactions.'],'Other Issue-Based Action Plan':['Other Issue-Based Action Plan','Work design','Make work lighter, clearer, and more predictable.'],'Referral and Follow-Up':['Referral and Follow-Up','Follow-up','One check-in, one support step, and one review date.']},print:['Individual non-diagnostic report','Created by','Result Summary','Main Stressors','Disclaimer','This tool is for individual screening, workplace health education, and guided action planning. It is not a diagnosis and does not replace professional healthcare assessment.','Follow-up','Other Issue Statement','Use Note','Accessed 25 June 2026']};
