name: Fix updater push command
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix workflow push ref
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/apply-bilingual-hd.yml')
          s = p.read_text(encoding='utf-8')
          s = s.replace('git push\n', 'git push origin HEAD:main\n')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-bilingual-hd.yml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Fix updater workflow push command"
            git push origin HEAD:main
          fi
